[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "HotswapFix"
description = "Fixes the Hotswap upgrade on the Scout Laser Rifle so Laser remains the default mode after opening menus or entering missions."
websiteUrl = "https://github.com/Little-Sparroh/HotswapFix"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/net48/HotswapFix.dll"
target = "BepInEx/plugins/HotswapFix.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "client" ]
